<!DOCTYPE html>
<html lang="en" data-theme="dark"> <!-- The data-theme="dark" attribute tells us which theme is currently active. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Event Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <header>
     <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <div id="logo">
                <a href="index.html">
                    <img id="theme-logo"
                         src="images/logo-dark.png"
                         alt="The Event Terminal Logo">
                </a>
            </div>
           

            <button class="navbar-toggler" type="button" 
                    data-bs-toggle="collapse"    
                    data-bs-target="#mainMenu"
                    aria-label="Toggle navigation">
                ☰
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">

                <div class="nav-links navbar-nav ms-auto">
                    <a href="index.html">HOME</a>
                    <a href="news.html">NEWS</a>
                    <a href="events.html">EVENTS</a>
                    <a href="clubs.html">CLUBS</a>
                    <a href="resources.html">RESOURCES</a>
                    <a href="contact.html">CONTACT</a>
                </div>

                <div id="theme" class="ms-lg-3">
                    <button id="theme-toggle">LIGHT MODE</button>
                </div>

            </div>
        </div>
     </nav>
    </header>
    <main>
        <section class="news-section">

            <h1>CONTACT &amp; EVENT PROPOSAL</h1>
            <p>Send us your feedback or submit a proposal for a new event.</p>

            <div class="row">

                <!-- Form -->
                <div class="col-lg-6">
                    <form id="proposal-form" novalidate>

                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control">
                        <small class="error-msg" id="name-error"></small>

                        <label for="email">Email</label>
                        <input type="text" id="email" class="form-control">
                        <small class="error-msg" id="email-error"></small>

                        <label for="society">Society Name</label>
                        <input type="text" id="society" class="form-control">
                        <small class="error-msg" id="society-error"></small>

                        <label for="event-date">Proposed Event Date</label>
                        <input type="date" id="event-date" class="form-control">
                        <small class="error-msg" id="date-error"></small>

                        <label for="message">Message / Event Description</label>
                        <textarea id="message" rows="4" class="form-control"></textarea>
                        <small class="error-msg" id="message-error"></small>

                        <button type="submit" class="tab-btn">SUBMIT</button>

                        <p id="success-msg">Thank you! Your message has been submitted successfully.</p>
                    </form>
                </div>

                <!-- Map -->
                <div class="col-lg-6">
                    <iframe class="map-frame"
                            src="https://www.google.com/maps?q=FAST+NUCES+Islamabad&output=embed"
                            loading="lazy"
                            title="University location"></iframe>
                </div>

            </div>

        </section>

    </main>
    <footer class="site-footer">
        <p>THE EVENT TERMINAL | YOUR CAMPUS. YOUR JOURNEY.</p>
        <p>&copy; 2026 The Event Terminal</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
